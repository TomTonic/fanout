---
version: "2"

run:
  timeout: 1m

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - revive
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    govet:
      enable:
        - shadow
      settings:
        printf:
          funcs:
            - (github.com/sirupsen/logrus.FieldLogger).Infof
            - (github.com/sirupsen/logrus.FieldLogger).Warnf
            - (github.com/sirupsen/logrus.FieldLogger).Errorf
            - (github.com/sirupsen/logrus.FieldLogger).Fatalf
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 2
      min-occurrences: 2
    depguard:
      rules:
        default:
          deny:
            # Inherited from the upstream project, which predates Go 1.13. The standard
            # library covers everything this code used pkg/errors for: %w wrapping since
            # 1.13, Is/As since 1.13, Join since 1.20, AsType since 1.26. Denying it here
            # keeps the old usage from creeping back while the migration is in progress.
            - pkg: "github.com/pkg/errors"
              desc: 'Use the standard library "errors" and fmt.Errorf with %w instead'
    nakedret:
      max-func-lines: 30
    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - builtinShadow
        - commentedOutCode
        - commentedOutImport
        - docStub
        - dupImport
        - emptyFallthrough
        - emptyStringTest
        - equalFold
        - evalOrder
        - hexLiteral
        - hugeParam
        - importShadow
        - indexAlloc
        - initClause
        - methodExprCall
        - nestingReduce
        - nilValReturn
        - octalLiteral
        - paramTypeCombine
        - ptrToRefParam
        - rangeExprCopy
        - rangeValCopy
        - regexpPattern
        - sloppyReassign
        - stringXbytes
        - typeAssertChain
        - typeUnparen
        - unlabelStmt
        - unnamedResult
        - unnecessaryBlock
        - weakCond
        - yodaStyleExpr
  exclusions:
    rules:
      - path: "setup_test.go"
        linters:
          - funlen
      - path: "setup.go"
        linters:
          - gochecknoinits
          - gosec
      - path: "fanout_test.go"
        linters:
          - gosec
      - path: "setup_test.go"
        linters:
          - gocyclo
      - path: "client.go"
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TomTonic/fanout

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
