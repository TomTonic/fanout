---
name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install yamllint
        run: python -m pip install --upgrade --user yamllint
      - name: Run yamllint
        run: ~/.local/bin/yamllint -c .yamllint.yml --strict .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -race ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: go test -race -short ./...

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # A short run per target, enough to catch a crasher introduced by the change
      # under review. Long-running campaigns belong in a scheduled workflow, not here.
      - name: Fuzz ServeDNS
        run: go test -run '^$' -fuzz FuzzServeDNS -fuzztime 60s .
      - name: Fuzz Domain trie
        run: go test -run '^$' -fuzz FuzzDomainAddAndContains -fuzztime 30s .

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  compliance:
    name: compliance checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Exclude github.com/pkg/errors
        run: |
          if grep -r --include='*.go' '"github.com/pkg/errors"' . ; then
            echo "Use the standard library errors package and fmt.Errorf with %w"
            echo "instead of github.com/pkg/errors"
            exit 1
          fi
      - name: Exclude replace in go.mod
        run: |
          grep '^replace' go.mod || exit 0
          exit 1

  checkgomod:
    name: check go.mod and go.sum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod tidy
      - name: Check for changes in go.mod or go.sum
        run: git diff --exit-code -- go.mod go.sum

  realworld:
    name: real-world tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run real-world integration tests
        # Run only tests matching the real-world integration pattern.
        # These tests are skipped in -short mode and also skip themselves
        # at runtime when the environment blocks required transports.
        run: go test -race -v -run TestRealWorld -timeout 10m ./...
