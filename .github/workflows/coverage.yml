---
# Test coverage with gist-based badge (no dead branch needed).
#
# Prerequisites:
#   1. Create a GitHub Gist with any initial file at https://gist.github.com
#   2. Create a PAT with 'gist' scope
#   3. Add secret  GIST_TOKEN          = the PAT
#   4. Add variable COVERAGE_GIST_ID   = the gist ID
#
# Badge markdown for your README:
#   [![Coverage](https://img.shields.io/endpoint?url=
#   https://gist.githubusercontent.com/<USER>/<GIST_ID>/raw/<REPO>-coverage.json)]
#   (https://gist.github.com/<USER>/<GIST_ID>)

name: Test Coverage

on: [push]

permissions:
  contents: read

# TODO: Adjust the threshold to your project's needs.
env:
  COVERAGE_THRESHOLD: 80

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test ./... -coverprofile=cover.out -covermode=atomic

      - name: Extract coverage percentage
        id: cov
        run: |
          COVERAGE=$(go tool cover -func=cover.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COVERAGE}%"

      - name: Check coverage threshold
        run: |
          COVERAGE_INT=${COVERAGE%%.*}
          if [ "${COVERAGE_INT}" -lt "${COVERAGE_THRESHOLD}" ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
        env:
          COVERAGE: ${{ steps.cov.outputs.coverage }}

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910  # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: ${{ github.event.repository.name }}-coverage.json
          label: coverage
          message: "${{ steps.cov.outputs.coverage }}%"
          valColorRange: ${{ steps.cov.outputs.coverage }}
          minColorRange: 50
          maxColorRange: 90
